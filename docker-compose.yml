services:
  yt-fomo:
    build: .
    container_name: yt-fomo
    restart: unless-stopped
    environment:
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-60}
      OUTPUT_DIR: /downloads
      DATA_DIR: /data
      GOTIFY_URL: ${GOTIFY_URL:-}
      GOTIFY_TOKEN: ${GOTIFY_TOKEN:-}
      TZ: ${TZ:-UTC}
      RETAIN_MAX_DAYS: ${RETAIN_MAX_DAYS:-0}
      RETAIN_MAX_SIZE_GB: ${RETAIN_MAX_SIZE_GB:-0}
      CLEAN_PART_AGE_HOURS: ${CLEAN_PART_AGE_HOURS:-0}
    volumes:
      - ./downloads:/downloads
      - ./data:/data
    ports:
      - "${HOST_PORT:-8090}:8080"
